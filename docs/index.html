<style>
  :root{--ink:#160F28;--muted:#5D6B91}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;color:#fff;background:radial-gradient(120% 70% at 50% 0%,#3A66D6 0%,#22398A 55%,#15235A 100%);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;overflow:hidden;overscroll-behavior:none;user-select:none;-webkit-user-select:none}
  #app{height:100%;max-width:440px;margin:0 auto;display:flex;flex-direction:column;padding:calc(6px + env(safe-area-inset-top)) 8px calc(8px + env(safe-area-inset-bottom));gap:5px;position:relative}
  .bar{display:flex;align-items:center;gap:5px;min-height:36px}
  .grow{flex:1}
  .pill,.ib{background:linear-gradient(#4B7BE0,#2B4FA8);border:2.5px solid var(--ink);border-radius:11px;padding:2px 9px;font-family:"Galmuri11","Black Han Sans",sans-serif;font-size:16px;color:#fff;white-space:nowrap;
    text-shadow:0 2px 0 var(--ink),0 0 2px var(--ink);box-shadow:inset 0 2px 0 rgba(255,255,255,.35),0 3px 0 var(--ink);position:relative}
  .ib{background:linear-gradient(#FFE066,#F7A600)}
  .ib i{position:absolute;top:-7px;right:-5px;font-style:normal;background:#E5484D;border:2px solid var(--ink);border-radius:50%;min-width:19px;height:19px;font-size:11px;line-height:15px;text-align:center;padding:0 3px}
  #stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
  #cv{touch-action:none;display:block}
  #ov{position:absolute;inset:0;background:rgba(10,14,40,.66);display:flex;align-items:center;justify-content:center;padding:12px;z-index:5}
  #ov.hide{display:none}
  .panel{background:linear-gradient(#EEF3FC,#C9D6EE);border:4px solid var(--ink);border-radius:22px;padding:14px;width:100%;max-width:390px;text-align:center;max-height:100%;overflow:auto;-webkit-overflow-scrolling:touch;color:var(--ink);box-shadow:0 6px 0 var(--ink),inset 0 3px 0 #fff}
  .panel h2{margin:2px 0 6px;font-family:"Galmuri11","Black Han Sans",sans-serif;font-weight:400;font-size:26px;color:#fff;text-shadow:0 3px 0 var(--ink),0 0 3px var(--ink),0 0 3px var(--ink)}
  .panel p{margin:5px 0;font-size:13.5px;line-height:1.55}
  .sub{color:var(--muted);font-size:12.5px!important}
  .logo{font-family:"Galmuri11","Black Han Sans",sans-serif;font-size:44px;line-height:1.05;color:#fff;-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:0 4px 0 var(--ink)}
  .logo span{color:#FFE066}
  .info{background:#fff;border:2px solid #9FB0D3;border-radius:12px;padding:8px 11px;font-size:13px;line-height:1.65;margin:8px 0;text-align:left}
  .info b{color:#2B4FA8}
  .eggs{display:flex;justify-content:center;gap:4px;margin:6px 0;font-family:"Galmuri11","Black Han Sans",sans-serif;font-size:11px}
  .eggs span{display:flex;flex-direction:column;align-items:center;gap:1px}
  .eggs canvas{width:34px;height:34px}
  .btn{display:block;width:100%;margin-top:8px;padding:10px;border-radius:15px;border:3px solid var(--ink);background:linear-gradient(#FFE066,#F7A600);color:#fff;font-family:"Galmuri11","Black Han Sans",sans-serif;font-size:21px;
    text-shadow:0 2px 0 var(--ink),0 0 3px var(--ink);box-shadow:inset 0 3px 0 rgba(255,255,255,.5),inset 0 -5px 0 rgba(0,0,0,.15),0 4px 0 var(--ink)}
  .btn.blue{background:linear-gradient(#7FC2FF,#2F6FE0)}.btn.green{background:linear-gradient(#9BE36A,#3E9B2A)}.btn.gray{background:linear-gradient(#B8C2D6,#7D89A6)}
  .btn:active{transform:translateY(3px);box-shadow:inset 0 3px 0 rgba(255,255,255,.5),0 1px 0 var(--ink)}
  .two{display:flex;gap:6px}.two .btn{flex:1;font-size:18px}
  .big{font-family:"Galmuri11","Black Han Sans",sans-serif;font-size:40px;color:#fff;text-shadow:0 3px 0 var(--ink),0 0 3px var(--ink),0 0 3px var(--ink);line-height:1.1}
  .grid{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin:6px 0}
  .card{position:relative;border:2.5px solid var(--ink);border-radius:10px;padding:1px 0 3px;box-shadow:inset 0 2px 0 rgba(255,255,255,.35),0 2px 0 var(--ink);text-align:center;cursor:pointer}
  .card canvas{width:100%;aspect-ratio:1;display:block}
  .card b{display:block;font-family:"Galmuri11","Black Han Sans",sans-serif;font-weight:400;font-size:10.5px;color:#fff;text-shadow:0 1px 0 var(--ink),0 0 2px var(--ink);white-space:nowrap;overflow:hidden}
  .card em{position:absolute;top:1px;left:2px;font-style:normal;font-size:8px;background:#E5484D;color:#fff;border-radius:4px;padding:0 3px;font-family:"Galmuri11","Black Han Sans"}
  .card .n{position:absolute;top:1px;right:3px;font-family:"Galmuri11","Black Han Sans",sans-serif;font-size:9px;color:#fff;text-shadow:0 1px 0 var(--ink)}
  .card .sh{position:absolute;top:1px;left:3px;font-size:10px}
  .r0{background:linear-gradient(#A9B8D6,#6E7FA6)}.r1{background:linear-gradient(#6EC1FF,#2F7FE0)}.r2{background:linear-gradient(#C99BFF,#7C4BD6)}.r3{background:linear-gradient(#FF9A8A,#D63A3A)}.r4{background:linear-gradient(#FFE27A,#F08C00)}
  .lock{background:linear-gradient(#7A86A3,#56607C)!important}
  .shy{background:linear-gradient(135deg,#FFB3D1,#FFE066,#9FE7FF,#C99BFF)!important}
  .setrow{display:flex;align-items:center;gap:6px;font-size:12px;margin:3px 0}
  .setrow em{font-style:normal;font-family:"Galmuri11","Black Han Sans",sans-serif;width:32px;text-align:left}
  .pbar{flex:1;position:relative;height:15px;background:#2B3A66;border:2px solid var(--ink);border-radius:8px;overflow:hidden}
  .pbar div{height:100%;background:linear-gradient(#FFE066,#F7A600)}
  .pbar span{position:absolute;inset:0;font-family:"Galmuri11","Black Han Sans",sans-serif;font-size:10px;line-height:11px;color:#fff;text-shadow:0 1px 0 var(--ink)}
  .rar{display:inline-block;color:#fff;border-radius:9px;padding:1px 10px;font-family:"Galmuri11","Black Han Sans",sans-serif;font-size:14px;border:2.5px solid var(--ink);text-shadow:0 1px 0 var(--ink)}
  .tog{display:flex;gap:6px;justify-content:center;margin:6px 0}
  .tog button{flex:1;padding:6px;border-radius:10px;border:2.5px solid var(--ink);background:#fff;font-family:"Galmuri11","Black Han Sans",sans-serif;font-size:14px;color:var(--ink)}
  .tog button.on{background:linear-gradient(#4B7BE0,#2B4FA8);color:#fff}
  *{border-radius:0!important}
  canvas{image-rendering:pixelated;image-rendering:crisp-edges}
  .panel,.btn,.pill,.ib,.card,.info,.rar,.tog button,.pbar{background-image:none!important}
  .pill{background-color:#3E66C8}.ib{background-color:#FFC93C}.panel{background-color:#DDE6F7}.btn{background-color:#FFC93C}.btn.blue{background-color:#3E8BF0}.btn.green{background-color:#56B83A}.btn.gray{background-color:#96A2BD}
  .r0{background-color:#8C9BBE}.r1{background-color:#3E9BE0}.r2{background-color:#9B5CF0}.r3{background-color:#E5484D}.r4{background-color:#F5B000}.lock{background-color:#66708C!important}.shy{background:repeating-linear-gradient(135deg,#FFB3D1 0 8px,#FFE066 8px 16px,#9FE7FF 16px 24px,#C99BFF 24px 32px)!important}
  .tog button.on{background-color:#3E66C8}.pbar div{background:#FFC93C!important}
  #toast{position:absolute;left:50%;top:52px;transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:12px;padding:7px 13px;font-family:"Galmuri11","Do Hyeon",sans-serif;font-size:15px;z-index:9;display:none;white-space:nowrap}
</style>
</head>

/* =================== 그리기 도구 (100×100 단위) =================== */
function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
function F(c,fill,lw){c.fillStyle=fill;c.fill();c.lineWidth=(lw||2.4)*1.15;c.strokeStyle=OL;c.stroke()}
function ell(c,x,y,rx,ry,rot){c.beginPath();c.ellipse(x,y,rx,ry,rot||0,0,6.2832)}
function circ(c,x,y,r){c.beginPath();c.arc(x,y,r,0,6.2832)}
function bodyPath(c,b){rr(c,b[0],b[1],b[2],b[3],Math.min(b[2],b[3])*0.44)}
function drawBody(c,b,col){bodyPath(c,b);c.fillStyle=col;c.fill();
  c.save();bodyPath(c,b);c.clip();ell(c,b[0]+b[2]*0.72,b[1]+b[3]*0.95,b[2]*0.75,b[3]*0.45);c.fillStyle='rgba(30,15,55,.16)';c.fill();
  ell(c,b[0]+b[2]*0.3,b[1]+b[3]*0.2,b[2]*0.26,b[3]*0.14,-0.5);c.fillStyle='rgba(255,255,255,.45)';c.fill();c.restore();
  bodyPath(c,b);c.lineWidth=2.4;c.strokeStyle=OL;c.stroke()}
function clipB(c,b,fn){c.save();bodyPath(c,b);c.clip();fn();c.restore();bodyPath(c,b);c.lineWidth=2.4;c.strokeStyle=OL;c.stroke()}
function feet(c,b,col){var y=b[1]+b[3]-1;ell(c,b[0]+b[2]*0.3,y,6.5,4.2);F(c,col);ell(c,b[0]+b[2]*0.7,y,6.5,4.2);F(c,col)}
function arms(c,b,col){var y=b[1]+b[3]*0.66;ell(c,b[0]+2.5,y,4.2,6.8,0.45);F(c,col);ell(c,b[0]+b[2]-2.5,y,4.2,6.8,-0.45);F(c,col)}
function tri(c,x1,y1,x2,y2,x3,y3,fill,noStroke){c.beginPath();c.moveTo(x1,y1);c.lineTo(x2,y2);c.lineTo(x3,y3);c.closePath();if(noStroke){c.fillStyle=fill;c.fill()}else F(c,fill)}
function cluster(c,arr,col){var i;c.strokeStyle=OL;c.lineWidth=4.8;for(i=0;i<arr.length;i++){circ(c,arr[i][0],arr[i][1],arr[i][2]);c.stroke()}
  c.fillStyle=col;for(i=0;i<arr.length;i++){circ(c,arr[i][0],arr[i][1],arr[i][2]);c.fill()}}
function flame(c,x,y,w,h,rot,col,inner){c.save();c.translate(x,y);c.rotate(rot||0);
  c.beginPath();c.moveTo(0,-h);c.bezierCurveTo(w*0.2,-h*0.6,w*0.62,-h*0.48,w*0.52,-h*0.1);c.bezierCurveTo(w*0.45,h*0.24,-w*0.45,h*0.24,-w*0.52,-h*0.1);c.bezierCurveTo(-w*0.6,-h*0.42,-w*0.12,-h*0.5,0,-h);c.closePath();F(c,col,2.2);
  if(inner){c.beginPath();c.moveTo(0,-h*0.5);c.bezierCurveTo(w*0.3,-h*0.28,w*0.3,h*0.04,0,h*0.06);c.bezierCurveTo(-w*0.3,h*0.04,-w*0.3,-h*0.28,0,-h*0.5);c.fillStyle=inner;c.fill()}c.restore()}

    if(b.cloud){cloudBlock(x,y,s);continue}
    block(x,y,s,willClear[r+','+c]?(preview?drag&&tray[drag.i].col:b.col):b.col);if(b.egg>=0){var lowT=b.t<=3;egg(x,y,s,b.egg,willClear[r+','+c]?Math.sin(time*20)*0.2:(lowT?Math.sin(time*18)*0.15:Math.sin(time*2+r+c)*0.05));timerBadge(x+s-13,y+3,b.t,lowT)}}
  if(preview){var tp=tray[drag.i];drawPiece(tp,BX+preview.c*CS,BY+preview.r*CS,CS,0.45);
    for(var k in willClear){var rc=k.split(',');ctx.fillStyle='rgba(255,255,255,'+(0.25+0.15*Math.sin(time*12))+')';rrect(ctx,BX+(+rc[1])*CS+2,BY+(+rc[0])*CS+2,CS-4,CS-4,7);ctx.fill()}}
  flashCells.forEach(function(f){var a=1-f.t/0.35,s=CS*(1+f.t*1.2);ctx.save();ctx.globalAlpha=a;block(BX+f.c*CS+(CS-s)/2,BY+f.r*CS+(CS-s)/2,s,f.col);ctx.fillStyle='rgba(255,255,255,'+a*0.7+')';rrect(ctx,BX+f.c*CS,BY+f.r*CS,CS,CS,8);ctx.fill();ctx.restore()});
  drawGauge();drawSkills();
  // 트레이
  if(tray)for(var i=0;i<3;i++){var tt=tray[i];if(tt.used)continue;if(drag&&drag.i===i)continue;var R=trayRect(i),ss=Math.min(26,Math.min(R.w/tt.w,R.h/tt.h)*0.9),fits=fitsAnywhere(tt);
    drawPiece(tt,R.x+(R.w-tt.w*ss)/2,R.y+(R.h-tt.h*ss)/2,ss,fits?1:0.35)}
  if(drag){var dp2=tray[drag.i];drawPiece(dp2,drag.x-dp2.w*CS/2,drag.y-LIFT-dp2.h*CS/2,CS,preview?0.95:0.8)}
  ctx.restore();
  // 파티클·글자
  var p;for(i=0;i<parts.length;i++){p=parts[i];ctx.globalAlpha=Math.max(0,1-p.t/p.life);if(p.star)sparkle(ctx,p.x,p.y,p.r*2.2,p.c,'rgba(42,36,51,.4)');else{ctx.fillStyle=p.c;var pr=Math.max(2,Math.round(p.r*1.4));ctx.fillRect(Math.round(p.x-pr/2),Math.round(p.y-pr/2),pr,pr)}}ctx.globalAlpha=1;
  ctx.textAlign='center';for(i=0;i<floats.length;i++){var fl=floats[i];ctx.globalAlpha=Math.min(1,(1.1-fl.t)*2.5);ctx.font=(fl.big?28:20)+'px "Galmuri11","Black Han Sans",sans-serif';var fy=fl.y-fl.t*36;ctx.lineWidth=6;ctx.strokeStyle=OL;ctx.strokeText(fl.s,fl.x,fy);ctx.fillStyle=fl.c;ctx.fillText(fl.s,fl.x,fy)}ctx.globalAlpha=1;
  // 부화 팝업
  if(popups.length){var pp=popups[0],big=pp.tier>=3||pp.sh,a=pp.t<0.2?pp.t/0.2:(pp.t>pp.life-0.3?Math.max(0,(pp.life-pp.t)/0.3):1),sc=pp.t<0.25?0.5+pp.t*2:1;
    ctx.save();ctx.globalAlpha=a;ctx.translate(W/2,BY+N*CS/2);ctx.scale(sc,sc);
    if(big){for(var ray=0;ray<12;ray++){ctx.save();ctx.rotate(time*0.8+ray*0.524);ctx.fillStyle=pp.sh?'hsla('+(ray*30+time*120)+',90%,75%,.45)':'rgba(255,230,120,.4)';ctx.beginPath();ctx.moveTo(-10,0);ctx.lineTo(0,-170);ctx.lineTo(10,0);ctx.fill();ctx.restore()}}
    var bw=big?230:190,bh=big?232:196;rrect(ctx,-bw/2,-bh/2,bw,bh,20);var gg=ctx.createLinearGradient(0,-bh/2,0,bh/2),rc2=[['#A9B8D6','#6E7FA6'],['#6EC1FF','#2F7FE0'],['#C99BFF','#7C4BD6'],['#FF9A8A','#D63A3A'],['#FFE27A','#F08C00']][pp.tier];
    gg.addColorStop(0,pp.sh?'#FFB3D1':rc2[0]);gg.addColorStop(1,pp.sh?'#9FE7FF':rc2[1]);ctx.fillStyle=gg;ctx.fill();ctx.lineWidth=4;ctx.strokeStyle=OL;ctx.stroke();
    drawSp(ctx,pp.i,pp.sh,0,big?40:30,big?150:124,1,1);
    ctx.font=(big?24:20)+'px "Galmuri11","Black Han Sans",sans-serif';ctx.lineWidth=6;ctx.strokeStyle=OL;var nm=(pp.sh?'✨ ':'')+SPC[pp.i].n;ctx.strokeText(nm,0,big?72:60);ctx.fillStyle='#fff';ctx.fillText(nm,0,big?72:60);
    ctx.font='13px "Galmuri11","Black Han Sans",sans-serif';ctx.lineWidth=4;var tag=(pp.isNew?'NEW! ':'')+RN[pp.tier]+(pp.sh?' · 이로치':'')+' 부화!';ctx.strokeText(tag,0,big?96:82);ctx.fillStyle='#FFF4C2';ctx.fillText(tag,0,big?96:82);
    ctx.restore()}
  drawSkillFx();
}

/* =================== 상단 =================== */
function skillLine(k){var s=skillStat(k);return SK[s.t].ic+' <b>'+SK[s.t].n+'</b>: '+SK[s.t].d(s.p)+'<br>⚡ 충전 '+s.need+'줄 · 점수 +'+Math.round(s.pas*100)+'% · Lv'+s.lv+(s.sh?' · ✨이로치 보너스':'')}
function powerOf(k){var s=skillStat(k);return s.p*10+(6-s.need)}
function showTeam(back){var keys=Object.keys(D.dex).sort(function(a,b){return powerOf(b)-powerOf(a)});
  var h='<h2>🐾 동행 영웅</h2><p class="sub">최대 3마리 · 줄을 지워 충전하고 탭해서 스킬 사용<br>등급·레벨(같은 영웅 부화 횟수)·이로치일수록 강해요</p><div class="grid" style="grid-template-columns:repeat(3,1fr);gap:6px">';
  for(var j=0;j<3;j++){var k=D.team[j];if(k){var s=skillStat(k);h+='<div class="card r'+s.r+(s.sh?' shy':'')+'" data-t="'+j+'"><span class="n">Lv'+s.lv+'</span><canvas width="100" height="100"></canvas><b>'+SK[s.t].ic+' '+SPC[s.i].n+'</b></div>'}
    else h+='<div class="card lock" style="display:flex;align-items:center;justify-content:center;min-height:90px"><b>빈 자리</b></div>'}
  h+='</div><div class="info" id="tInfo" style="min-height:44px">아래에서 영웅을 눌러 넣거나 빼세요</div><div class="grid">';
  keys.forEach(function(k){var s=skillStat(k),on=D.team.indexOf(k)>=0;h+='<div class="card r'+s.r+(s.sh?' shy':'')+'" data-k="'+k+'" style="'+(on?'outline:3px solid #5FD35A;outline-offset:1px':'')+'"><span class="n">Lv'+s.lv+'</span>'+(on?'<em style="background:#3E9B2A">동행</em>':'')+'<canvas width="100" height="100"></canvas><b>'+SK[s.t].ic+' '+SPC[s.i].n+'</b></div>'});
  h+='</div><p class="sub">같은 영웅을 3·6·10·15번 부화시키면 레벨이 올라요. 바뀐 동행은 다음 판부터 적용돼요.</p><button class="btn" id="tOk">완료</button>';
  showOv(h);
  document.querySelectorAll('#panel .card[data-t]').forEach(function(el){var k=D.team[+el.getAttribute('data-t')];drawOn(el.querySelector('canvas'),idxOf(k),skillStat(k).sh,false);el.onclick=function(){D.team.splice(D.team.indexOf(k),1);sv();showTeam(back)}});
  document.querySelectorAll('#panel .card[data-k]').forEach(function(el){var k=el.getAttribute('data-k');drawOn(el.querySelector('canvas'),idxOf(k),skillStat(k).sh,false);
    el.onclick=function(){var ix=D.team.indexOf(k);if(ix>=0)D.team.splice(ix,1);else{if(D.team.length>=3){$('tInfo').innerHTML='3마리까지예요. 위의 영웅을 눌러 먼저 빼 주세요.<br>'+skillLine(k);return}D.team.push(k)}sv();showTeam(back);$('tInfo').innerHTML=skillLine(k)}});
  $('tOk').onclick=function(){if(back)back();else{hideOv();if(!started){skills=D.team.filter(function(k){return D.dex[k]}).slice(0,3).map(function(k){var s=skillStat(k);s.charge=0;return s})}else toast('바뀐 동행은 다음 판부터 적용돼요')}}}
function uiTop(){var o=own(),nk=Object.keys(D.newKeys).length;
  $('top').innerHTML='<div class="pill">🥚 '+D.hatched+'</div><div class="pill">📖 '+o.n+'/'+NSP+'</div><div class="grow"></div><button class="pill" id="teamB" style="background:linear-gradient(#9BE36A,#3E9B2A)">🐾 동행</button><button class="ib" id="dexTop">도감'+(nk?'<i>'+nk+'</i>':'')+'</button><button class="pill" id="setB" style="background:linear-gradient(#36508F,#22346A)">⚙️</button>';
  $('dexTop').onclick=function(){showDex(false)};$('setB').onclick=showSettings;$('teamB').onclick=function(){showTeam()}}
function showDex(fromOver){D.newKeys={};sv();uiTop();var o=own();
  var h='<h2>📖 영웅 도감</h2><p class="sub">부화 '+D.hatched+'회 · 도감 '+o.n+'/'+NSP+' · 이로치 '+o.s+'/'+NSP+'</p><div class="info" style="padding:6px 10px">';
  for(var r=0;r<5;r++){var got=0,tot=0;for(var i=0;i<NSP;i++)if(SPC[i].r===r){tot++;if(D.dex[SPC[i].k])got++}
    h+='<div class="setrow"><em style="color:'+RC[r]+'">'+RN[r]+'</em><div class="pbar"><div style="width:'+(got/tot*100)+'%"></div><span>'+got+'/'+tot+'</span></div></div>'}
  h+='</div><div class="grid">';
  var order=SPC.map(function(s,i){return i}).sort(function(a,b){return SPC[a].r-SPC[b].r||a-b});
  order.forEach(function(i){var k=SPC[i].k,rec=D.dex[k];h+='<div class="card r'+SPC[i].r+(rec?'':' lock')+'" data-i="'+i+'">'+(rec&&rec.s?'<span class="sh">✨</span>':'')+(rec?'<span class="n">×'+rec.n+'</span>':'')+'<canvas width="100" height="100"></canvas><b>'+(rec?SPC[i].n:'???')+'</b></div>'});
  h+='</div><button class="btn gray" id="cB">'+(fromOver?'돌아가기':'닫기')+'</button>';
  showOv(h);document.querySelectorAll('#panel .card').forEach(function(el){var i=+el.getAttribute('data-i');drawOn(el.querySelector('canvas'),i,false,!D.dex[SPC[i].k]);el.onclick=function(){showDetail(i,false,fromOver)}});
  $('cB').onclick=function(){if(fromOver)gameOver();else hideOv()}}
function showDetail(i,sh,fromOver){var sp=SPC[i],rec=D.dex[sp.k],known=rec&&(sh?rec.s:rec.n);
  var h='<span class="rar" style="background:'+RC[sp.r]+'">'+RN[sp.r]+(sh?' · ✨ 이로치':'')+'</span><canvas id="big" width="320" height="320" style="width:170px;height:170px;display:block;margin:0 auto"></canvas>'
   +'<h2>'+(known?(sh?'✨ ':'')+sp.n:'???')+'</h2><p>'+(known?sp.f:(sh?'이로치는 부화할 때 1% 확률로 나와요.':RN[sp.r]+' 알('+['흰','파란','보라','빨간','금'][sp.r]+'색)에서 부화해요.'))+'</p><p class="sub">'+(ORIGIN[sp.o]||'')+' · '+sp.el+' · 부화 '+(rec?rec.n:0)+'회 · 이로치 '+(rec?rec.s:0)+'회</p>'
   +(rec?'<div class="info">'+skillLine(sp.k)+'</div><button class="btn green" id="tmB">'+(D.team.indexOf(sp.k)>=0?'✔ 동행 중':'🐾 동행하기')+'</button>':'<div class="info">'+SK[skillType(sp.k)].ic+' 스킬: <b>'+SK[skillType(sp.k)].n+'</b></div>')
   +'<div class="tog"><button id="tN" class="'+(sh?'':'on')+'">기본</button><button id="tS" class="'+(sh?'on':'')+'">✨ 이로치</button></div><button class="btn gray" id="bB">도감으로</button>';
  showOv(h);drawOn($('big'),i,sh,!known);$('tN').onclick=function(){showDetail(i,false,fromOver)};$('tS').onclick=function(){showDetail(i,true,fromOver)};$('bB').onclick=function(){showDex(fromOver)};var tb=$('tmB');if(tb)tb.onclick=function(){if(D.team.indexOf(sp.k)>=0){showDetail(i,sh,fromOver);return}if(D.team.length>=3)D.team.pop();D.team.push(sp.k);sv();toast(sp.n+' 동행! 다음 판부터 함께해요');showDetail(i,sh,fromOver)}}
function showSettings(){showOv('<h2>⚙️ 설정</h2><button class="btn blue" id="muB">'+(muted?'🔇 소리 켜기':'🔊 소리 끄기')+'</button><button class="btn" id="hB">❓ 규칙 보기</button><button class="btn gray" id="nB">새 게임</button><button class="btn gray" id="cB">닫기</button><p class="sub" style="margin-top:10px"><a href="privacy.html" style="color:#2B4FA8">개인정보 처리방침</a> · <a href="terms.html" style="color:#2B4FA8">이용약관</a><br>신화 블록 v1.0.0</p>');
  $('muB').onclick=function(){muted=!muted;showSettings()};
  $('hB').onclick=showHelp;$('nB').onclick=newGame;$('cB').onclick=hideOv}
function eggRow(){var h='<div class="eggs">';for(var t=0;t<5;t++)h+='<span><canvas id="eg'+t+'" width="68" height="68"></canvas>'+RN[t]+'</span>';return h+'</div>'}
function drawEggs(){for(var t=0;t<5;t++){var el=$('eg'+t);if(!el)continue;var c=el.getContext('2d');var save2=ctx;ctx=c;c.setTransform(2,0,0,2,0,0);c.clearRect(0,0,34,34);egg(0,-1,34,t,0);ctx=save2}}
function showHelp(){showOv('<div class="logo">신화<span>블록</span></div><p class="sub" style="margin-top:6px">영웅은 알에서 태어난다 — 주몽·박혁거세처럼</p>'
  +'<div class="info">• 블록을 끌어다 놓아 <b>가로·세로 한 줄</b>을 채우면 지워져요<br>• 🥚 <b>알이 든 블록</b>을 지우면 한국·그리스·북유럽 신화의 영웅이 부화해요 (50명)<br>• 한 번에 <b>2줄 이상</b> 지우면 보드 위 <b>다른 알이 한 단계 자라요</b> (3줄이면 두 단계)</div>'
  +eggRow()+'<div class="info">• 알을 오래 키울수록 좋은 영웅이 나오지만, <b>게임이 끝나면 남은 알은 사라져요</b><br>• 부화할 때 1% 확률로 <b>이로치</b>!</div>'
  +'<div class="info">⏱️ <b>서둘러요!</b><br>• ☁️ <b>먹구름 게이지</b>가 실시간으로 차요. 다 차면 빈칸에 먹구름 블록이 떨어져요. 줄을 지우면 게이지가 줄어요<br>• 보드에 놓인 알은 <b>9수 안에</b> 지워야 해요. 0이 되면 먹구름이 삼켜요</div>'
  +'<div class="info">🐾 <b>동행 영웅</b> 3마리의 스킬<br>• 줄을 지우면 충전, 버튼을 탭해서 사용 (폭발·얼리기·청소·알 성장…)<br>• <b>등급·레벨·이로치</b>일수록 스킬이 강하고 빨리 차요</div><button class="btn" id="goB">시작!</button>');
  drawEggs();$('goB').onclick=function(){if(!D.seen){D.seen=true;sv()}if(!board||over)newGame();else hideOv()}}

/* =================== 루프 =================== */
var last=0;
function frame(t){var dt=Math.min(0.05,(t-last)/1000||0.016);last=t;try{update(dt);draw()}catch(err){console.error(err)}requestAnimationFrame(frame)}
fit();if(D.test)EGG_CHANCE=0.5;newGame();if(!D.seen)showHelp();requestAnimationFrame(frame);
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(function(){uiTop()});
if('serviceWorker' in navigator&&location.protocol==='https:'){navigator.serviceWorker.register('sw.js').catch(function(){})}
window.__ev={useSkill:useSkill,skills:function(){return skills},gauge:function(){return gauge},D:D,tray:function(){return tray},board:function(){return board},place:place,canPlace:canPlace,over:function(){return over},score:function(){return score}};
})();
