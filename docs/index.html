<style>
  :root{--ink:#160F28;--muted:#5D6B91}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;color:#fff;background:radial-gradient(120% 70% at 50% 0%,#3A66D6 0%,#22398A 55%,#15235A 100%);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;overflow:hidden;overscroll-behavior:none;user-select:none;-webkit-user-select:none}
  #app{height:100%;max-width:440px;margin:0 auto;display:flex;flex-direction:column;padding:calc(6px + env(safe-area-inset-top)) 8px calc(8px + env(safe-area-inset-bottom));gap:5px;position:relative}
  .bar{display:flex;align-items:center;gap:5px;min-height:36px}
  .grow{flex:1}
  .pill,.ib{background:linear-gradient(#4B7BE0,#2B4FA8);border:2.5px solid var(--ink);border-radius:11px;padding:2px 9px;font-family:"Galmuri11","Black Han Sans",sans-serif;font-size:16px;color:#fff;white-space:nowrap;
    text-shadow:0 2px 0 var(--ink),0 0 2px var(--ink);box-shadow:inset 0 2px 0 rgba(255,255,255,.35),0 3px 0 var(--ink);position:relative}
  .ib{background:linear-gradient(#FFE066,#F7A600)}
  .ib i{position:absolute;top:-7px;right:-5px;font-style:normal;background:#E5484D;border:2px solid var(--ink);border-radius:50%;min-width:19px;height:19px;font-size:11px;line-height:15px;text-align:center;padding:0 3px}
  #stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
  #cv{touch-action:none;display:block}
  #ov{position:absolute;inset:0;background:rgba(10,14,40,.66);display:flex;align-items:center;justify-content:center;padding:12px;z-index:5}
  #ov.hide{display:none}
  .panel{background:linear-gradient(#EEF3FC,#C9D6EE);border:4px solid var(--ink);border-radius:22px;padding:14px;width:100%;max-width:390px;text-align:center;max-height:100%;overflow:auto;-webkit-overflow-scrolling:touch;color:var(--ink);box-shadow:0 6px 0 var(--ink),inset 0 3px 0 #fff}
  .panel h2{margin:2px 0 6px;font-family:"Galmuri11","Black Han Sans",sans-serif;font-weight:400;font-size:26px;color:#fff;text-shadow:0 3px 0 var(--ink),0 0 3px var(--ink),0 0 3px var(--ink)}
  .panel p{margin:5px 0;font-size:13.5px;line-height:1.55}
  .sub{color:var(--muted);font-size:12.5px!important}
  .logo{font-family:"Galmuri11","Black Han Sans",sans-serif;font-size:44px;line-height:1.05;color:#fff;-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:0 4px 0 var(--ink)}
  .logo span{color:#FFE066}
  .info{background:#fff;border:2px solid #9FB0D3;border-radius:12px;padding:8px 11px;font-size:13px;line-height:1.65;margin:8px 0;text-align:left}
  .info b{color:#2B4FA8}
  .eggs{display:flex;justify-content:center;gap:4px;margin:6px 0;font-family:"Galmuri11","Black Han Sans",sans-serif;font-size:11px}
  .eggs span{display:flex;flex-direction:column;align-items:center;gap:1px}
  .eggs canvas{width:34px;height:34px}
  .btn{display:block;width:100%;margin-top:8px;padding:10px;border-radius:15px;border:3px solid var(--ink);background:linear-gradient(#FFE066,#F7A600);color:#fff;font-family:"Galmuri11","Black Han Sans",sans-serif;font-size:21px;
    text-shadow:0 2px 0 var(--ink),0 0 3px var(--ink);box-shadow:inset 0 3px 0 rgba(255,255,255,.5),inset 0 -5px 0 rgba(0,0,0,.15),0 4px 0 var(--ink)}
  .btn.blue{background:linear-gradient(#7FC2FF,#2F6FE0)}.btn.green{background:linear-gradient(#9BE36A,#3E9B2A)}.btn.gray{background:linear-gradient(#B8C2D6,#7D89A6)}
  .btn:active{transform:translateY(3px);box-shadow:inset 0 3px 0 rgba(255,255,255,.5),0 1px 0 var(--ink)}
  .two{display:flex;gap:6px}.two .btn{flex:1;font-size:18px}
  .big{font-family:"Galmuri11","Black Han Sans",sans-serif;font-size:40px;color:#fff;text-shadow:0 3px 0 var(--ink),0 0 3px var(--ink),0 0 3px var(--ink);line-height:1.1}
  .grid{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin:6px 0}
  .card{position:relative;border:2.5px solid var(--ink);border-radius:10px;padding:1px 0 3px;box-shadow:inset 0 2px 0 rgba(255,255,255,.35),0 2px 0 var(--ink);text-align:center;cursor:pointer}
  .card canvas{width:100%;aspect-ratio:1;display:block}
  .card b{display:block;font-family:"Galmuri11","Black Han Sans",sans-serif;font-weight:400;font-size:10.5px;color:#fff;text-shadow:0 1px 0 var(--ink),0 0 2px var(--ink);white-space:nowrap;overflow:hidden}
  .card em{position:absolute;top:1px;left:2px;font-style:normal;font-size:8px;background:#E5484D;color:#fff;border-radius:4px;padding:0 3px;font-family:"Galmuri11","Black Han Sans"}
  .card .n{position:absolute;top:1px;right:3px;font-family:"Galmuri11","Black Han Sans",sans-serif;font-size:9px;color:#fff;text-shadow:0 1px 0 var(--ink)}
  .card .sh{position:absolute;top:1px;left:3px;font-size:10px}
  .r0{background:linear-gradient(#A9B8D6,#6E7FA6)}.r1{background:linear-gradient(#6EC1FF,#2F7FE0)}.r2{background:linear-gradient(#C99BFF,#7C4BD6)}.r3{background:linear-gradient(#FF9A8A,#D63A3A)}.r4{background:linear-gradient(#FFE27A,#F08C00)}
  .lock{background:linear-gradient(#7A86A3,#56607C)!important}
  .shy{background:linear-gradient(135deg,#FFB3D1,#FFE066,#9FE7FF,#C99BFF)!important}
  .setrow{display:flex;align-items:center;gap:6px;font-size:12px;margin:3px 0}
  .setrow em{font-style:normal;font-family:"Galmuri11","Black Han Sans",sans-serif;width:32px;text-align:left}
  .pbar{flex:1;position:relative;height:15px;background:#2B3A66;border:2px solid var(--ink);border-radius:8px;overflow:hidden}
  .pbar div{height:100%;background:linear-gradient(#FFE066,#F7A600)}
  .pbar span{position:absolute;inset:0;font-family:"Galmuri11","Black Han Sans",sans-serif;font-size:10px;line-height:11px;color:#fff;text-shadow:0 1px 0 var(--ink)}
  .rar{display:inline-block;color:#fff;border-radius:9px;padding:1px 10px;font-family:"Galmuri11","Black Han Sans",sans-serif;font-size:14px;border:2.5px solid var(--ink);text-shadow:0 1px 0 var(--ink)}
  .tog{display:flex;gap:6px;justify-content:center;margin:6px 0}
  .tog button{flex:1;padding:6px;border-radius:10px;border:2.5px solid var(--ink);background:#fff;font-family:"Galmuri11","Black Han Sans",sans-serif;font-size:14px;color:var(--ink)}
  .tog button.on{background:linear-gradient(#4B7BE0,#2B4FA8);color:#fff}
  *{border-radius:0!important}
  canvas{image-rendering:pixelated;image-rendering:crisp-edges}
  .panel,.btn,.pill,.ib,.card,.info,.rar,.tog button,.pbar{background-image:none!important}
  .pill{background-color:#3E66C8}.ib{background-color:#FFC93C}.panel{background-color:#DDE6F7}.btn{background-color:#FFC93C}.btn.blue{background-color:#3E8BF0}.btn.green{background-color:#56B83A}.btn.gray{background-color:#96A2BD}
  .r0{background-color:#8C9BBE}.r1{background-color:#3E9BE0}.r2{background-color:#9B5CF0}.r3{background-color:#E5484D}.r4{background-color:#F5B000}.lock{background-color:#66708C!important}.shy{background:repeating-linear-gradient(135deg,#FFB3D1 0 8px,#FFE066 8px 16px,#9FE7FF 16px 24px,#C99BFF 24px 32px)!important}
  .tog button.on{background-color:#3E66C8}.pbar div{background:#FFC93C!important}
  .nrow{display:flex;gap:6px;margin-top:8px}.nrow input{flex:1;min-width:0;font:inherit;font-size:16px;padding:8px;border:3px solid #1B1530;background:#fff;color:#1B1530;-webkit-user-select:text;user-select:text}
  .btn.sm{width:auto!important;padding:8px 14px!important;margin:0!important;font-size:15px}

function circ(c,x,y,r){c.beginPath();c.arc(x,y,r,0,6.2832)}

  return fetch(SB+path,{method:'POST',headers:h,body:JSON.stringify(body||{})}).then(function(r){return r.text().then(function(t){var j=null;try{j=t?JSON.parse(t):null}catch(e){}
    if(!r.ok)throw new Error((j&&(j.message||j.msg||j.error_description||j.error))||('http'+r.status));return j})})}
function keepAuth(j){AU={at:j.access_token,rt:j.refresh_token,exp:Date.now()/1000+(j.expires_in||3600)};save('mbAuth',AU);return AU.at}
function token(){if(AU&&AU.at&&AU.exp>Date.now()/1000+60)return Promise.resolve(AU.at);
  if(AU&&AU.rt){var rt=AU.rt;AU=null;return sbReq('/auth/v1/token?grant_type=refresh_token',{refresh_token:rt}).then(keepAuth).catch(function(){return token()})}
  return sbReq('/auth/v1/signup',{data:{app:'myth-block'}}).then(keepAuth)}
function rpc(fn,args){return token().then(function(t){return sbReq('/rest/v1/rpc/'+fn,args||{},t)})}
function errMsg(e){var m=String(e&&e.message||e);
  if(m.indexOf('nickname_taken')>=0)return '이미 누가 쓰는 닉네임이에요';if(m.indexOf('bad_nickname')>=0)return '한글·영문·숫자 2~10자로 정해 주세요';
  if(m.indexOf('too_fast')>=0)return '잠시 뒤 다시 등록할게요';if(m.indexOf('invalid')>=0)return '기록을 확인할 수 없어요';
  if(m.indexOf('no_nickname')>=0)return '닉네임을 먼저 정해 주세요';return '인터넷 연결을 확인해 주세요'}
function flushPend(){if(!PEND||!NICK)return Promise.resolve(null);var p=PEND;
  return rpc('myth_submit',{p_score:p.s,p_level:p.l,p_moves:p.m,p_secs:p.t}).then(function(r){if(PEND===p){PEND=null;save('mbPend',null)}return r},
    function(e){if(String(e.message).indexOf('invalid')>=0||String(e.message).indexOf('no_nickname')>=0&&false){PEND=null;save('mbPend',null)}throw e})}
function nickForm(){return '<div class="nrow"><input id="nkI" maxlength="10" autocomplete="off" placeholder="닉네임 (한글·영문·숫자 2~10자)"><button class="btn blue sm" id="nkB">등록</button></div><p class="sub" id="nkM"></p>'}
function bindNick(done){$('nkB').onclick=function(){var v=$('nkI').value.trim();
  if(!/^[가-힣A-Za-z0-9_]{2,10}$/.test(v)){$('nkM').textContent='한글·영문·숫자 2~10자로 정해 주세요';return}
  $('nkM').textContent='등록 중…';rpc('myth_set_nickname',{p_nick:v}).then(function(n){NICK=n;save('mbNick',n);done()}).catch(function(e){if($('nkM'))$('nkM').textContent=errMsg(e)})}}
function rkLine(r){return '<div class="info rk" id="rkOpen">🏆 이번 주 <b>'+r.week_rank+'위</b> · 주간 최고 '+r.week_best.toLocaleString()+'<span>랭킹 ›</span></div>'}
function rankAfterGame(){var box=$('rkBox');if(!box||score<=0)return;
  if(lastRk&&lastRk.s===score&&lastRk.r){box.innerHTML=rkLine(lastRk.r);$('rkOpen').onclick=function(){showRank('week',gameOver)};return}
  var secs=Math.max(1,Math.round((Date.now()-t0)/1000));if(!PEND||score>PEND.s){PEND={s:score,l:lvl,m:moves,t:secs};save('mbPend',PEND)}
  var go=function(){box.innerHTML='<p class="sub">🏆 랭킹 등록 중…</p>';var sc=score;
    flushPend().then(function(r){if(!r)return;lastRk={s:sc,r:r};if($('rkBox')){$('rkBox').innerHTML=rkLine(r);$('rkOpen').onclick=function(){showRank('week',gameOver)}}})
      .catch(function(e){if($('rkBox'))$('rkBox').innerHTML='<p class="sub">🏆 '+errMsg(e)+'</p>'})};
  if(NICK)go();else{box.innerHTML='<div class="info">🏆 <b>주간 랭킹에 이 기록을 올려 보세요</b>'+nickForm()+'</div>';bindNick(go)}}
function showRank(tab,back){tab=tab||'week';var close=back||hideOv;
  var h='<h2>🏆 랭킹</h2><div class="tog"><button id="rkW" class="'+(tab==='week'?'on':'')+'">이번 주</button><button id="rkA" class="'+(tab==='all'?'on':'')+'">역대</button></div>'
   +'<div id="rkL"><p class="sub">불러오는 중…</p></div>'+(NICK?'':'<div class="info">닉네임을 정하면 내 기록이 올라가요'+nickForm()+'</div>')
   +'<p class="sub">주간 랭킹은 매주 월요일 0시(한국 시간)에 초기화돼요</p><button class="btn gray" id="rkC">닫기</button>';
  showOv(h);$('rkW').onclick=function(){showRank('week',back)};$('rkA').onclick=function(){showRank('all',back)};$('rkC').onclick=function(){close()};
  if(!NICK)bindNick(function(){flushPend().catch(function(){}).then(function(){showRank(tab,back)})});
  (PEND&&NICK?flushPend().catch(function(){}):Promise.resolve()).then(function(){return rpc('myth_leaderboard',{p_scope:tab})}).then(function(r){
    if(r.nickname&&!NICK){NICK=r.nickname;save('mbNick',NICK)}
    var rows=r.top||[],x='';
    if(!rows.length)x='<p class="sub">아직 기록이 없어요. 첫 1등이 되어 보세요!</p>';
    else{x='<div class="rkl">';rows.forEach(function(e){x+='<div class="rkr'+(e.me?' me':'')+'"><b>'+(e.rank<=3?['🥇','🥈','🥉'][e.rank-1]:e.rank)+'</b><span>'+esc(e.nickname)+'</span><em>'+e.level+'단계</em><i>'+e.score.toLocaleString()+'</i></div>'});x+='</div>'}
    if(r.me&&!rows.some(function(e){return e.me}))x+='<div class="rkl"><div class="rkr me"><b>'+r.me.rank+'</b><span>'+esc(r.me.nickname)+'</span><em>나</em><i>'+r.me.score.toLocaleString()+'</i></div></div>';
    if($('rkL'))$('rkL').innerHTML=x}).catch(function(e){if($('rkL'))$('rkL').innerHTML='<p class="sub">'+errMsg(e)+'</p>'})}

if('serviceWorker' in navigator&&location.protocol==='https:'){navigator.serviceWorker.register('sw.js').catch(function(){})}
window.__ev={useSkill:useSkill,skills:function(){return skills},gauge:function(){return gauge},D:D,tray:function(){return tray},board:function(){return board},place:place,canPlace:canPlace,over:function(){return over},score:function(){return score}};
})();
</script>
